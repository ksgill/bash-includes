# Reusable shell CI. Called by each consumer repository so there is one
# definition rather than five drifting copies.
#
# This repository is public, so callers need no secret: build.sh clones it
# anonymously over https, and a public repository's reusable workflows are
# callable without the Actions -> Access setting a private one requires.
#
# The build job deliberately uses the same path a user gets: ./build.sh with
# no BASH_INCLUDES_DIR, cloning the tag pinned in LIB_VERSION. An earlier
# version injected the library via env var — which meant the pin was never
# exercised, and a stale LIB_VERSION shipped unnoticed.

name: shell-ci

on:
  workflow_call:
    inputs:
      build:
        description: "Run ./build.sh (pinned clone path) and check dist/ is current"
        type: boolean
        default: true
      smoke:
        description: "Command(s) run from a checkout with BASH_INCLUDES_DIR set — exercises the dev bootstrap the build path strips"
        type: string
        default: ""

jobs:
  shellcheck:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Install shellcheck
        run: sudo apt-get update && sudo apt-get install -y shellcheck

      # dist/ is generated — its findings belong to the sources it was built
      # from, so checking it would just double-report every issue.
      - name: shellcheck sources
        run: |
          # Select by shebang, not by extension. An extension glob silently
          # skips whole repositories of extensionless commands — and reports
          # success while checking nothing.
          mapfile -t files < <(
            git ls-files \
              | grep -v '^dist/' \
              | while read -r f; do [[ -f "$f" ]] && head -1 "$f" 2>/dev/null | grep -q '^#!.*\(bash\|sh\)' && echo "$f"; done
          )
          if [[ ${#files[@]} -eq 0 ]]; then
            echo "::error::No shell scripts found — the selector is probably wrong"
            exit 1
          fi
          # Library files are sourced fragments, so SC1091 (can't follow
          # source) and SC2034 (unused var, set for the caller) are expected.
          printf '%s\n' "${files[@]}"
          shellcheck -x -e SC1091,SC2034 -S warning "${files[@]}"

  build:
    if: inputs.build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0    # build.sh stamps git describe

      - name: Build via the pinned clone path
        run: ./build.sh     # no BASH_INCLUDES_DIR: clones the LIB_VERSION tag

      - name: dist/ is current
        run: |
          # The version stamp names the source revision built from, so a
          # committed dist/ always trails by one commit. Compare everything
          # except that line.
          fail=0
          for f in dist/*; do
            if ! git cat-file -e "HEAD:$f" 2>/dev/null; then
              echo "::error file=$f::$f is not committed — run ./build.sh and commit"
              fail=1
              continue
            fi
            if ! diff <(grep -v '^SCRIPT_VERSION=\|^# Version:' "$f") \
                      <(git show "HEAD:$f" | grep -v '^SCRIPT_VERSION=\|^# Version:') >/dev/null; then
              echo "::error file=$f::$f is stale — run ./build.sh and commit"
              fail=1
            fi
          done
          exit $fail

  smoke:
    if: inputs.smoke != ''
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Check out bash-includes at the pinned tag
        run: |
          git clone --quiet --depth 1 --branch "$(cat LIB_VERSION)" \
            https://github.com/ksgill/bash-includes.git .lib

      # Checkout mode runs the development bootstrap that the build strips —
      # the one code path a dist-only test can never reach.
      - name: Run from the checkout
        run: |
          export BASH_INCLUDES_DIR="$PWD/.lib/lib"
          ${{ inputs.smoke }}

  bats:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - id: check
        run: echo "have=$([[ -d tests ]] && echo yes || echo no)" >> "$GITHUB_OUTPUT"
      - if: steps.check.outputs.have == 'yes'
        run: sudo apt-get update && sudo apt-get install -y bats
      - if: steps.check.outputs.have == 'yes'
        run: bats tests/
